<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="#111827"/>
  
  <!-- Clipboard base -->
  <rect x="8" y="10" width="16" height="16" rx="2" fill="#1f2937" stroke="#374151" stroke-width="1"/>
  
  <!-- Clipboard top clip -->
  <rect x="13" y="8" width="6" height="4" rx="1" fill="#111827" stroke="#374151" stroke-width="1"/>
  <rect x="14.5" y="8.5" width="3" height="2" rx="0.5" fill="#374151"/>
  
  <!-- Checkmark (done task line) -->
  <path d="M12 17.5 L14.5 20 L20 14" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Task lines -->
  <line x1="12" y1="22" x2="20" y2="22" stroke="#4b5563" stroke-width="1.5" stroke-linecap="round"/>
</svg>
